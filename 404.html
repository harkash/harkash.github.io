<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Harish Haresamudram</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    // Old al-folio URLs without their own redirect page (see publications/, cv/, etc.).
    (function () {
      const p = location.pathname;
      const to =
        p === "/assets/pdf/Short_CV_Haresamudram.pdf" ? "/assets/cv.pdf" :
        p.startsWith("/news/") ? "/#news" :
        p.startsWith("/blog/") ? "/blog.html" :
        null;
      if (to) location.replace(to);
    })();
  </script>
</head>
<body>
<div class="page">
  <main>
    <section class="hero" style="grid-template-columns:1fr; padding-top:6rem">
      <div>
        <h1>Page not found</h1>
        <p class="lede">This page has moved or no longer exists. Most content now lives on the home page.</p>
        <p><a href="/">Go to harkash.github.io →</a></p>
      </div>
    </section>
  </main>
</div>
</body>
</html>
